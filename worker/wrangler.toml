# Rules Lookup proxy (feature 7, D23). Deploy with `npm run worker:deploy`.
# The Gemini key is a secret: `npm run worker:secret` (never put it in this file).
name = "caster-companion-rules"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Shared with the app (src/features/rules/askConfig.ts). Obfuscation only.
APP_TOKEN = "cc-rules-v1-7f3a9c"
# Set to "on" to switch in-app answers off; the app then offers chat-app handoff.
KILL_SWITCH = "off"
# Free-tier Gemini model. Check AI Studio's model list if it gets retired.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Card store (D29): official card text for interaction questions, one key "cards".
# Create once with `npx wrangler kv namespace create CARDS --config worker/wrangler.toml`
# and paste the printed id here. Fill it with `npm run cards:seed -- --remote`.
[[kv_namespaces]]
binding = "CARDS"
id = "ad01510d112b4502a65e766fd109399d"

# Every 15 minutes, add up to 2 new cards from the sitemap (D29).
[triggers]
crons = ["*/15 * * * *"]

# Per-IP limit: 12 questions a minute (D24).
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 12
  period = 60
